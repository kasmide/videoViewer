<!DOCTYPE html>
<html>
	<head>
		<title>Video Viewer</title>
		<meta charset="utf-8" name="viewport" content="width=device-width" />
		<script type="text/javascript" src="config.js"></script>
		<script type="text/javascript" src="script.js"></script>
		<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/ress/dist/ress.min.css" />
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
		<link rel="stylesheet" type="text/css" href="style.css" />
		<link rel="stylesheet" type="text/css" href="elements.css" />
	</head>

	<body>
		<!--ポップアッププレイヤー-->
		<div id="dialog" class="" onclick="Close()">
			<a id="close" href="javascript:Close()">
				<i class="material-icons close_icon">close</i>
			</a>
		</div>

		<!--検索UI-->
		<div id="searchUI">
			<select id="service" onchange="serviceMenuChange();search()">
				<option value="youtube">YouTube</option>
				<option value="nico">ニコニコ動画</option>
				<option value="bookmark">ブックマーク</option>
			</select>
			<form id="SearchForm" onsubmit="search();return false">
				<input type="text" id="Search" value="" placeholder="検索..." />
				<a id="clear" href="javascript:clear()"><i class="material-icons clear_icon">clear</i></a>
				<button id="Search" onclick="search()">
					<i class="material-icons search_icon">search</i>
				</button>
			</form>

			<div id="bookmark_menu">
				<button onclick="bookmark_export()"><i class="material-icons button_icon">cloud_download</i>エクスポート</button>
				<button onclick="bookmark_import()"><i class="material-icons button_icon">cloud_upload</i>インポート</button>
				<button onclick="bookmark_delall()"><i class="material-icons">delete</i>すべて削除</button>
			</div>
		</div>

		<main>
			<div id="searchOptions_nico" class="searchOptions" style="display:none">
				<div>
					<p>検索対象:</p>
					<select class="target" onchange="search()">
						<option value="title,description,tags">タイトルなど</option>
						<option value="tagsExact">タグ</option>
					</select>
				</div>
				<div>
					<p>ソート順:</p>
					<select class="sort" onchange="search()">
						<option value="-viewCounter">再生回数</option>
						<option value="startTime">新着順</option>
						<option value="-commentCounter">コメント数</option>
					</select>
				</div>
			</div>

			<div id="searchOptions_yt" class="searchOptions">
				<div>
					<p>ソート順:</p>
					<select class="sort" onchange="search()">
						<option value="relevance">関連順</option>
						<option value="date">新着順</option>
						<option value="viewCount">再生回数</option>
					</select>
				</div>
			</div>
			<div id="options_bookmark" class="searchOptions">

			</div>
			<!--検索結果-->
			<div id="resultBox"></div>
			<div id="welcome">
				<h1>Video Viewer</h1>
				<p>上の検索ボックスに<wbr />キーワードを入力して<wbr />検索<br /></p>
				<p>左上のメニューから検索ソース<wbr /> (YouTube かニコニコ動画) <wbr />を選択できます。</p>
			</div>
			<div id=nothing_found>
				表示できるアイテムがありません。
			</div>
		</main>
		<footer>
			<div>
				<p id="appinfo"><a href="https://gitlab.com/kasmide/videoviewer" title="Fork me on GitLab">kasmide / videoViewer</a></p>
			</div>
		</footer>
	</body>
</html>
