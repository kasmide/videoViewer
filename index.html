<!DOCTYPE HTML>
<html>

<head>
    <title>Video Viewer</title>
    <meta charset="utf-8" name="viewport" content="width=device-width" />
    <script type="text/javascript" src="script.js"></script>
    <link rel="stylesheet" type="text/css" href="reset.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>

    <!--ポップアッププレイヤー-->
    <div id="dialog" class="" onclick="Close()">
        <a id="close" href="javascript:Close()"><img class=icon22 src="./icons/22/close.svg" alt=""></img></a>
        </iframe>
    </div>

    <!--検索UI-->
    <div id="searchUI">
        <select id="service" size="1" onchange="search()">
            <option value="youtube">YouTube</option>
            <option value=nico>ニコニコ動画</option>
            <option value="bookmark">ブックマーク</option>
        </select>
        <form id="SearchForm" onsubmit="search();return false">
        <input type="text" id="Search" value="" placeholder="検索..."></form>
        <a id="clear" href="javascript:clear()"><img src="./icons/22/clear.svg" alt="clear"></a>
        <button id="Search" onclick="search()"><img class=icon32 src=./icons/24/find.svg alt="検索"></img></button>
    </div>
    <!--検索結果-->
    <div id="resultBox"></div>
    <div id=welcome>
        <h1>Video Viewer</h1>
        <p>上の検索ボックスに<wbr>キーワードを入力して<wbr>検索<br></p>
            <p>左上のメニューから検索ソース<wbr> (YouTube かニコニコ動画) <wbr>を選択できます。</p>
    </div>
    <footer>
        <div>
            <p>このサイトでは以下のソフトウェアを利用しています:</p>
            <a href="https://github.com/KDE/breeze-icons">Breeze Icons </a>- KDE Community (LGPL)
        </div>
        <div>
            <p>当サイトのソースコード:</p>
            <a href=https://gitlab.com/kasmide/videoviewer>kasmide / videoViewer</a>・ <a
                href=https://gitlab.com/kasmide/videoviewer/issues>Issues </a> </div> </footer> </body> </html>
