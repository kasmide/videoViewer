# This file is a template, and might need editing before it works on your project.
# Full project: https://gitlab.com/pages/plain-html
pages:
  stage: deploy
  script:
    - echo let youtubeKey = \"$YOUTUBE_API_KEY\"\;>>config.js
    - echo const deployed_revision = \"r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)\"\;>>config.js
    - mkdir .public
    - cp -r * .public
    - mv .public public
  artifacts:
    paths:
      - public
  only:
    - master
